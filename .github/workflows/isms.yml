name: ISMS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Makes `quarto run` pass deno `--cached-only`. Every `stdlib/*` specifier the CLI imports is
      # already in the cache Quarto ships, so this costs nothing and turns a stray remote import
      # into a loud failure rather than a silently acquired dependency. It covers the composition
      # pre-render hook as well as the explicit `quarto run` steps below.
      QUARTO_RUN_NO_NETWORK: "true"
    steps:
      - uses: actions/checkout@v7

      # No TinyTeX and no Chromium: the project renders `isms-html` only, with no executable cells,
      # no mermaid and no graphviz. Nothing here is worth caching either — Quarto seeds its Deno
      # cache by copying from its own install, and restoring `.quarto/` across runs would risk
      # masking the stale-composition bugs the tiers below exist to catch.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.25" # _extension.yml declares quarto-required: ">=1.8.0"

      # First, because it is the fastest and because nothing else does it: `quarto render` runs the
      # CLI through `deno run`, which never type-checks.
      - name: Type-check the CLI
        run: quarto run _tests/typecheck.ts

      # Fixture tiers. No render needed — these build their own throwaway projects in temp dirs.
      - name: Unit and fixture tests
        run: quarto run _tests/run.ts

      - name: Render (runs the isms composition pre-render hook)
        run: quarto render

      # Now that there is composed output and a rendered site, the tiers that inspect them.
      - name: Verify the composed output and the rendered site
        run: quarto run _tests/run.ts --site

      - name: Upload the rendered site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          retention-days: 7
